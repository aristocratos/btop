name: Anolis CMake

permissions: { }

on:
  workflow_dispatch:
  push:
    branches: main
    tags-ignore: '*.*'
    paths:
      - '.github/workflows/cmake-anolis.yml'
      - 'CMakeLists.txt'
      - 'cmake/**'
      - 'include/**'
      - 'src/*pp'
      - 'src/linux/*pp'
      - 'tests/**'
  pull_request:
    branches: main
    paths:
      - '.github/workflows/cmake-anolis.yml'
      - 'CMakeLists.txt'
      - 'cmake/**'
      - 'include/**'
      - 'src/*pp'
      - 'src/linux/*pp'
      - 'tests/**'

jobs:
  build:
    runs-on: ubuntu-24.04
    concurrency:
      group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Start loong64 container
        run: |
          docker run --platform linux/loong64 \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            --name loong64-builder \
            -d openanolis/anolisos:23.4 \
            sleep infinity

      - name: Install dependencies
        run: |
          docker exec loong64-builder bash -c '
            set -e
            dnf install -y git cmake gcc-toolset-14 gcc-toolset-14-gcc-c++ ninja-build
          '

      - name: Configure
        run: |
          docker exec loong64-builder bash -c '
            set -e
            source /opt/rh/gcc-toolset-14/enable
            cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug
          '

      - name: Compile
        run: |
          docker exec loong64-builder bash -c '
            set -e
            source /opt/rh/gcc-toolset-14/enable
            cmake --build build --verbose
          '

      - name: Test
        run: |
          docker exec loong64-builder bash -c '
            set -e
            source /opt/rh/gcc-toolset-14/enable
            ctest --test-dir build
          '
